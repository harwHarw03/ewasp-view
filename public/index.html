<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-WASP View</title>
    <style>
        body {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #camera-container {
            width: 60%;
            padding-right: 20px;
        }

        #sensor-container {
            width: 20%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        /* Toggle switch styles */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
    </style>
</head>
<body>
<div id="camera-container">
    <select id="camera-select"></select>
    <video id="webcam" width="100%" height="auto" autoplay></video>
</div>

<div id="sensor-container">
    <h1>Sensor</h1>
    <table id="sensor-table">
        <thead>
            <tr>
                <th>Data</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="sensor-data"></tbody>
    </table>

    <!-- MQTT Arming toggle switch -->
    <label class="toggle-switch">
        <input type="checkbox" id="arming-toggle">
        <span class="slider"></span>
    </label>
</div>

<script src="script.js"></script>
</body>
</html>
